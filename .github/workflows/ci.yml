name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests ──────────────────────────────────────────────
  python-tests:
    name: Python Tests (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy 02_estimation/python 03_control/python 04_fault_detection
        continue-on-error: true   # Non-blocking until type hints are complete

      - name: Run pytest
        run: |
          pytest \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            -v

  # ── C++ build and tests ───────────────────────────────────────
  cpp-tests:
    name: C++ Build and Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libeigen3-dev \
            python3-dev \
            python3-pip

      - name: Install pybind11
        run: pip3 install pybind11

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run C++ tests
        run: |
          cd build
          ctest --output-on-failure

  # ── Code formatting check ─────────────────────────────────────
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install black
        run: pip install black==24.4.2

      - name: Check formatting
        run: black --check .

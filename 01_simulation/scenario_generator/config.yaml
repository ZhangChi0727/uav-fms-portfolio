# Scenario parameter space definition
# Each key defines the range swept during batch generation

scenario:
  duration_s: 120
  n_scenarios: 5000

uav:
  mass_kg: 1.5
  initial_altitude_m: [10, 50]

wind:
  speed_ms: [0.0, 8.0]
  direction_deg: [0, 360]

gps:
  dropout_enabled: true
  dropout_start_s: [30, 90]
  dropout_duration_s: [10, 120]

faults:
  types: [none, imu_bias, imu_drift, noise_spike, gps_dropout, gps_spoof]
  fault_start_s: [20, 100]
